<!DOCTYPE html>
<html>
<head>
    <title>AI Chess Detection</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <style>
        .container { display: flex; gap: 20px; justify-content: center; padding: 20px; }
        #board { width: 400px; }
        .video-feed { border: 2px solid #333; }
    </style>
</head>
<body>
    <h2 style="text-align:center">AI Chess Vision</h2>
    <div class="container">
        <div>
            <h3>Real-World Feed</h3>
            <img src="{{ url_for('video_feed') }}" class="video-feed" width="600">
        </div>

        <div>
            <h3>Virtual Mapping</h3>
            <div id="board"></div>
        </div>
    </div>

    <script>
        var board = Chessboard('board', 'start');

        function updateBoard() {
            $.getJSON('/board_state', function(data) {
                // 'data' is an object like {e4: 'wP', f7: 'bK'}
                board.position(data); 
            });
        }

        // Poll the server every 500ms for updates
        setInterval(updateBoard, 500);
    </script>
</body>
</html>
